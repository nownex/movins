<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="آخر أخبار الأفلام والمسلسلات والأعمال القادمة وتطورات السينما."
>

<meta
    name="theme-color"
    content="#07080d"
>

<title>MOVINS — أخبار الأفلام</title>


<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>


<style>


/* =====================================================
   RESET
===================================================== */

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


html {

    scroll-behavior: smooth;

}


body {

    min-height: 100vh;

    font-family:

        "Cairo",
        Arial,
        sans-serif;

    background:

        radial-gradient(

            circle at 50% -10%,

            rgba(255,16,24,.12),

            transparent 35%

        ),

        #07080d;

    color: white;

    overflow-x: hidden;

}


/* =====================================================
   HEADER
===================================================== */

header {

    position: sticky;

    top: 0;

    z-index: 100;

    background:

        rgba(7,8,13,.96);

    backdrop-filter:

        blur(20px);

    border-bottom:

        1px solid

        rgba(255,255,255,.07);

}


.header-inner {

    width:

        min(

            1400px,

            calc(100% - 40px)

        );

    min-height: 82px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


.logo {

    text-decoration: none;

    color: white;

    font-family:

        Arial,
        sans-serif;

    font-size: 34px;

    font-weight: 900;

    letter-spacing: -2px;

}


.logo .red {

    color: #ff1018;

}


.back-button {

    text-decoration: none;

    color: white;

    background: #12151e;

    border:

        1px solid #2a2e39;

    padding:

        10px 18px;

    border-radius: 12px;

    font-size: 13px;

    font-weight: 800;

    transition: .25s;

}


.back-button:hover {

    background: #ff1018;

    border-color: #ff1018;

}


/* =====================================================
   HERO
===================================================== */

.hero {

    width:

        min(

            1400px,

            calc(100% - 40px)

        );

    margin: auto;

    padding:

        70px 20px 45px;

    text-align: center;

}


.hero-label {

    color: #ff1018;

    font-size: 13px;

    font-weight: 900;

    letter-spacing: 2px;

    margin-bottom: 12px;

}


.hero h1 {

    font-size:

        clamp(

            38px,

            6vw,

            68px

        );

    font-weight: 900;

    margin-bottom: 18px;

}


.hero h1 span {

    color: #ff1018;

}


.hero p {

    max-width: 800px;

    margin: auto;

    color: #9fa4b0;

    font-size: 16px;

    line-height: 2;

}


/* =====================================================
   MAIN
===================================================== */

main {

    width:

        min(

            1400px,

            calc(100% - 40px)

        );

    margin: auto;

    padding:

        20px 20px 100px;

}


/* =====================================================
   SECTION
===================================================== */

.section-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 30px;

    gap: 20px;

}


.section-title {

    font-size: 30px;

    font-weight: 900;

}


.news-count {

    color: #777d8b;

    font-size: 13px;

}


/* =====================================================
   GRID
===================================================== */

.news-grid {

    display: grid;

    grid-template-columns:

        repeat(

            3,

            minmax(0,1fr)

        );

    gap: 22px;

}


/* =====================================================
   CARD
===================================================== */

.news-card {

    background: #10131b;

    border:

        1px solid #20242e;

    border-radius: 20px;

    overflow: hidden;

    cursor: pointer;

    transition: .3s;

}


.news-card:hover {

    transform:

        translateY(-7px);

    border-color:

        rgba(255,16,24,.8);

    box-shadow:

        0 25px 60px

        rgba(0,0,0,.45);

}


.news-image-wrap {

    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    overflow: hidden;

    background: #08090d;

}


.news-image {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

    transition:

        transform .4s ease;

}


.news-card:hover .news-image {

    transform:

        scale(1.05);

}


/* =====================================================
   NO IMAGE
===================================================== */

.no-image {

    width: 100%;

    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 15px;

    background:

        radial-gradient(

            circle at top,

            #202735,

            #090b11 70%

        );

}


.no-image img {

    width: 85px;

    height: 85px;

    object-fit: contain;

    background: white;

    padding: 14px;

    border-radius: 18px;

}


.no-image-name {

    color: white;

    font-weight: 900;

    font-size: 17px;

}


.no-image-text {

    color: #777d8b;

    font-size: 12px;

}


.news-category {

    position: absolute;

    top: 12px;

    right: 12px;

    background: #ff1018;

    color: white;

    padding:

        7px 12px;

    border-radius: 9px;

    font-size: 10px;

    font-weight: 900;

}


.news-content {

    padding: 20px;

}


.news-date {

    color: #777d8b;

    font-size: 11px;

    margin-bottom: 8px;

}


.news-title {

    font-size: 19px;

    line-height: 1.7;

    font-weight: 900;

    margin-bottom: 10px;

}


.news-description {

    color: #a7abb6;

    font-size: 13px;

    line-height: 2;

    display:

        -webkit-box;

    -webkit-line-clamp: 3;

    -webkit-box-orient: vertical;

    overflow: hidden;

}


.read-more {

    display: inline-block;

    margin-top: 18px;

    color: #ff3037;

    font-size: 12px;

    font-weight: 900;

}


/* =====================================================
   STATE
===================================================== */

.state {

    grid-column: 1 / -1;

    text-align: center;

    padding: 100px 20px;

    color: #818794;

}


.state-icon {

    font-size: 48px;

    margin-bottom: 15px;

}


/* =====================================================
   MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 1000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:

        rgba(0,0,0,.82);

    backdrop-filter:

        blur(12px);

}


.modal.active {

    display: flex;

}


.modal-box {

    width:

        min(

            850px,

            100%

        );

    max-height: 90vh;

    overflow-y: auto;

    background: #10131b;

    border:

        1px solid #292e3a;

    border-radius: 24px;

    position: relative;

    box-shadow:

        0 30px 100px

        rgba(0,0,0,.7);

}


.modal-image {

    width: 100%;

    max-height: 420px;

    object-fit: cover;

    display: block;

}


.modal-fallback {

    height: 250px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 15px;

    background:

        linear-gradient(

            135deg,

            #171c28,

            #080a10

        );

}


.modal-fallback img {

    width: 90px;

    height: 90px;

    background: white;

    padding: 15px;

    border-radius: 20px;

}


.modal-content {

    padding: 35px;

}


.modal-category {

    display: inline-block;

    background: #ff1018;

    padding:

        7px 13px;

    border-radius: 8px;

    font-size: 11px;

    font-weight: 900;

    margin-bottom: 16px;

}


.modal-title {

    font-size:

        clamp(

            24px,

            4vw,

            42px

        );

    line-height: 1.6;

    margin-bottom: 18px;

}


.modal-meta {

    color: #858b99;

    font-size: 13px;

    margin-bottom: 25px;

}


.modal-summary {

    color: #c0c4ce;

    font-size: 17px;

    line-height: 2.2;

}


.modal-original-title {

    margin-top: 25px;

    padding: 18px;

    border-radius: 14px;

    background: #0a0c12;

    color: #777d8b;

    font-size: 13px;

}


.original-link {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    margin-top: 30px;

    background: #ff1018;

    color: white;

    text-decoration: none;

    padding:

        13px 20px;

    border-radius: 12px;

    font-weight: 900;

    transition: .25s;

}


.original-link:hover {

    transform:

        translateY(-2px);

    background: #ff3037;

}


.close-modal {

    position: absolute;

    top: 15px;

    left: 15px;

    z-index: 5;

    width: 42px;

    height: 42px;

    border: 0;

    border-radius: 50%;

    background:

        rgba(0,0,0,.7);

    color: white;

    font-size: 24px;

    cursor: pointer;

}


/* =====================================================
   FOOTER
===================================================== */

footer {

    text-align: center;

    border-top:

        1px solid #1d2028;

    padding:

        40px 20px;

    color: #656b77;

    font-size: 13px;

}


footer strong {

    color: white;

    font-family: Arial;

    font-size: 24px;

}


footer .red {

    color: #ff1018;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:900px) {

    .news-grid {

        grid-template-columns:

            repeat(

                2,

                minmax(0,1fr)

            );

    }

}


@media (max-width:600px) {

    .header-inner {

        width:

            calc(100% - 24px);

    }


    .logo {

        font-size: 28px;

    }


    .back-button {

        padding: 8px 12px;

        font-size: 11px;

    }


    .hero {

        width:

            calc(100% - 24px);

        padding:

            45px 10px 30px;

    }


    .hero p {

        font-size: 13px;

    }


    main {

        width:

            calc(100% - 24px);

        padding:

            15px 0 70px;

    }


    .section-header {

        flex-direction: column;

        align-items: center;

        text-align: center;

    }


    .news-grid {

        grid-template-columns: 1fr;

        gap: 15px;

    }


    .modal-content {

        padding: 25px 20px;

    }


    .modal-summary {

        font-size: 15px;

    }

}


</style>

</head>


<body>


<!-- HEADER -->

<header>

<div class="header-inner">

<a
    href="./"
    class="logo"
>

MOV<span class="red">INS</span>

</a>


<a
    href="./"
    class="back-button"
>

← العودة إلى الأفلام

</a>

</div>

</header>


<!-- HERO -->

<section class="hero">

<div class="hero-label">

MOVINS • MOVIE NEWS

</div>


<h1>

آخر

<span>

أخبار الأفلام

</span>

</h1>


<p>

تابع أحدث أخبار السينما والأفلام والمسلسلات،
مع ملخصات عربية وروابط مباشرة للمصادر الأصلية.

</p>

</section>


<!-- MAIN -->

<main>


<div class="section-header">

<h2 class="section-title">

📰 أحدث الأخبار

</h2>


<div
    id="newsCount"
    class="news-count"
>

جاري تحميل الأخبار...

</div>

</div>


<section
    id="newsGrid"
    class="news-grid"
>

</section>


</main>


<!-- FOOTER -->

<footer>

<strong>

MOV<span class="red">INS</span>

</strong>


<p style="margin-top:10px;">

أخبار الأفلام والمسلسلات في مكان واحد.

</p>

</footer>


<!-- =====================================================
     MODAL
===================================================== -->

<div
    id="newsModal"
    class="modal"
>

<div
    class="modal-box"
>


<button
    id="closeModal"
    class="close-modal"
>

×


</button>


<div
    id="modalBody"
>

</div>


</div>

</div>


<script>


/* =====================================================
   ELEMENTS
===================================================== */

const newsGrid =

document.getElementById(
    "newsGrid"
);


const newsCount =

document.getElementById(
    "newsCount"
);


const newsModal =

document.getElementById(
    "newsModal"
);


const modalBody =

document.getElementById(
    "modalBody"
);


const closeModal =

document.getElementById(
    "closeModal"
);


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value) {

    return String(
        value || ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =====================================================
   NEWS DATA
===================================================== */

let newsItems = [];


/* =====================================================
   LOAD NEWS
===================================================== */

async function loadNews() {

    try {

        const response =

        await fetch(

            "movie-news.json?t=" +

            Date.now(),

            {

                cache: "no-store"

            }

        );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =

        await response.json();


        newsItems =

        Array.isArray(
            data.items
        )

        ?

        data.items

        :

        [];


        renderNews(
            newsItems
        );


    } catch (error) {

        console.error(
            error
        );


        newsGrid.innerHTML = `

        <div class="state">

            <div class="state-icon">

                ⚠️

            </div>

            <h3>

                لا توجد أخبار متاحة حالياً

            </h3>

            <p>

                سيتم تحديث الأخبار قريباً.

            </p>

        </div>

        `;


        newsCount.textContent =

        "تعذر تحميل الأخبار";

    }

}


/* =====================================================
   RENDER NEWS
===================================================== */

function renderNews(items) {

    newsCount.textContent =

    `${items.length} خبر متاح`;


    if (!items.length) {

        newsGrid.innerHTML = `

        <div class="state">

            <div class="state-icon">

                📰

            </div>

            <h3>

                لا توجد أخبار حالياً

            </h3>

        </div>

        `;

        return;

    }


    newsGrid.innerHTML =

    items

    .map(

        (item, index) =>

        createNewsCard(
            item,
            index
        )

    )

    .join("");

}


/* =====================================================
   CREATE CARD
===================================================== */

function createNewsCard(
    item,
    index
) {

    const title =

    escapeHtml(
        item.title
    );


    const description =

    escapeHtml(

        item.summary ||

        item.description

    );


    const category =

    escapeHtml(

        item.category ||

        "أخبار السينما"

    );


    const date =

    escapeHtml(
        item.date
    );


    let imageHtml = "";


    if (item.image) {

        imageHtml = `

        <img

            class="news-image"

            src="${escapeHtml(item.image)}"

            alt="${title}"

            loading="lazy"

            onerror="
                this.parentElement.innerHTML =
                createFallbackImage(
                    ${index}
                )
            "

        >

        `;

    } else {

        imageHtml =

        createFallbackImage(
            index
        );

    }


    return `

    <article

        class="news-card"

        onclick="openNews(${index})"

    >


        <div
            class="news-image-wrap"
        >

            ${imageHtml}


            <div
                class="news-category"
            >

                ${category}

            </div>


        </div>


        <div
            class="news-content"
        >


            <div
                class="news-date"
            >

                ${date}

            </div>


            <h2
                class="news-title"
            >

                ${title}

            </h2>


            <p
                class="news-description"
            >

                ${description}

            </p>


            <div
                class="read-more"
            >

                اقرأ الملخص ←

            </div>


        </div>


    </article>

    `;

}


/* =====================================================
   FALLBACK IMAGE
===================================================== */

function createFallbackImage(index) {

    const item =

    newsItems[index];


    if (!item) {

        return "";

    }


    return `

    <div
        class="no-image"
    >

        <img

            src="${escapeHtml(
                item.sourceLogo || ""
            )}"

            alt="${escapeHtml(
                item.source || ""
            )}"

        >


        <div
            class="no-image-name"
        >

            ${escapeHtml(
                item.source || "MOVINS"
            )}

        </div>


        <div
            class="no-image-text"
        >

            أخبار السينما

        </div>


    </div>

    `;

}


/* =====================================================
   OPEN NEWS
===================================================== */

function openNews(index) {

    const item =

    newsItems[index];


    if (!item) {

        return;

    }


    const title =

    escapeHtml(
        item.title
    );


    const summary =

    escapeHtml(

        item.summary ||

        item.description ||

        "لا يتوفر ملخص لهذا الخبر حالياً."

    );


    const source =

    escapeHtml(
        item.source
    );


    const date =

    escapeHtml(
        item.date
    );


    const category =

    escapeHtml(
        item.category
    );


    const originalTitle =

    escapeHtml(
        item.originalTitle
    );


    let visual = "";


    if (item.image) {

        visual = `

        <img

            class="modal-image"

            src="${escapeHtml(item.image)}"

            alt="${title}"

            onerror="
                this.outerHTML =
                '<div class=&quot;modal-fallback&quot;>' +
                '<img src=&quot;${escapeHtml(
                    item.sourceLogo || ""
                )}&quot;>' +
                '<strong>${source}</strong>' +
                '</div>'
            "

        >

        `;

    } else {

        visual = `

        <div
            class="modal-fallback"
        >

            <img

                src="${escapeHtml(
                    item.sourceLogo || ""
                )}"

            >


            <strong>

                ${source}

            </strong>


        </div>

        `;

    }


    modalBody.innerHTML = `

    ${visual}


    <div
        class="modal-content"
    >


        <div
            class="modal-category"
        >

            ${category}

        </div>


        <h1
            class="modal-title"
        >

            ${title}

        </h1>


        <div
            class="modal-meta"
        >

            ${date}
            •
            المصدر:
            ${source}

        </div>


        <div
            class="modal-summary"
        >

            ${summary}

        </div>


        ${
            originalTitle
            ?
            `

            <div
                class="modal-original-title"
            >

                <strong>

                    العنوان الأصلي:

                </strong>

                <br>

                ${originalTitle}

            </div>

            `
            :
            ""
        }


        ${
            item.url
            ?
            `

            <a

                class="original-link"

                href="${escapeHtml(item.url)}"

                target="_blank"

                rel="noopener noreferrer"

            >

                قراءة الخبر الأصلي من المصدر ↗

            </a>

            `
            :
            ""
        }


    </div>

    `;


    newsModal.classList.add(
        "active"
    );


    document.body.style.overflow =

    "hidden";

}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeNewsModal() {

    newsModal.classList.remove(
        "active"
    );


    document.body.style.overflow =

    "";

}


closeModal.addEventListener(

    "click",

    closeNewsModal

);


newsModal.addEventListener(

    "click",

    function(event) {

        if (
            event.target === newsModal
        ) {

            closeNewsModal();

        }

    }

);


document.addEventListener(

    "keydown",

    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeNewsModal();

        }

    }

);


/* =====================================================
   START
===================================================== */

loadNews();


</script>


</body>

</html>
