name: MOVINS Movie News Update

on:

  # تشغيل تلقائي كل 6 ساعات
  schedule:
    - cron: "0 */6 * * *"

  # يسمح لك بتشغيله يدوياً من GitHub Actions
  workflow_dispatch:

  # تشغيل عند تعديل ملفات الأخبار
  push:
    paths:
      - "update_movie_news.py"
      - "requirements.txt"
      - ".github/workflows/update-movie-news.yml"


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:


      # ================================================
      # DOWNLOAD REPOSITORY
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ================================================
      # PYTHON
      # ================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ================================================
      # INSTALL LIBRARIES
      # ================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ================================================
      # UPDATE MOVIE NEWS
      # ================================================

      - name: Update movie news
        run: |

          python update_movie_news.py


      # ================================================
      # CHECK FILE
      # ================================================

      - name: Check generated news
        run: |

          python - << 'PYTHON'

          import json

          with open(
              "movie-news.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          items = data.get(
              "items",
              []
          )


          print(
              "MOVIE NEWS:",
              len(items)
          )


          if not items:

              raise RuntimeError(
                  "No movie news generated"
              )

          PYTHON


      # ================================================
      # COMMIT NEW NEWS
      # ================================================

      - name: Commit and push news
        run: |

          git config user.name "MOVINS News Bot"

          git config user.email "movins-bot@users.noreply.github.com"


          git add movie-news.json


          if git diff --cached --quiet; then

            echo "No news changes."

          else

            git commit -m "Update MOVINS movie news"

            git push

          fi
