name: MOVINS Movie News Update

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: movins-movie-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4


      # ==========================================
      # CHECK GEMINI API KEY
      # ==========================================

      - name: Check Gemini API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is missing."
            exit 1
          fi

          echo "GEMINI_API_KEY found."


      # ==========================================
      # SYNC REPOSITORY
      # ==========================================

      - name: Sync with latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main


      # ==========================================
      # UPDATE MOVIE NEWS
      # ==========================================

      - name: Update movie news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_movie_news.py


      # ==========================================
      # CHECK GENERATED NEWS
      # ==========================================

      - name: Check generated news
        run: |
          python - <<'PYTHON'
          import json
          import os

          filename = "movie-news.json"

          if not os.path.exists(filename):
              raise RuntimeError(
                  "movie-news.json was not created"
              )

          with open(
              filename,
              "r",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          items = data.get("items", [])

          print()
          print("=================================")
          print("MOVIE NEWS:", len(items))
          print("=================================")
          print()

          if len(items) == 0:
              raise RuntimeError(
                  "No movie or series news generated"
              )

          for index, item in enumerate(items, 1):

              title = item.get("title", "")
              image = item.get("image", "")
              summary = item.get("summary", "")

              print(f"{index}. {title}")
              print(f"   Summary length: {len(summary)}")

              if not title:
                  raise RuntimeError(
                      f"Article {index} has no title"
                  )

              if not image:
                  raise RuntimeError(
                      f"Article {index} has no image"
                  )

          print()
          print("All generated news passed validation.")
          PYTHON


      # ==========================================
      # COMMIT AND PUSH
      # ==========================================

      - name: Commit and push news
        run: |
          git config user.name "MOVINS News Bot"
          git config user.email "actions@github.com"

          git add movie-news.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update MOVINS movie news"

          git push origin main


      # ==========================================
      # COMPLETE
      # ==========================================

      - name: Complete job
        run: |
          echo "================================="
          echo "MOVINS MOVIE NEWS UPDATE COMPLETED"
          echo "================================="
