name: MOVINS Movie News Update

on:
  workflow_dispatch:

  schedule:
    # كل 6 ساعات
    - cron: "0 */6 * * *"

permissions:
  contents: write

# يمنع تشغيل عمليتين في نفس الوقت وبالتالي يمنع تعارض movie-news.json
concurrency:
  group: movins-movie-news-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4


      # ======================================================
      # CHECK GEMINI API KEY
      # ======================================================

      - name: Check Gemini API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is missing."
            echo "Add GEMINI_API_KEY in:"
            echo "Repository Settings → Secrets and variables → Actions"
            exit 1
          fi

          echo "GEMINI_API_KEY found."


      # ======================================================
      # GET LATEST REPOSITORY VERSION
      # ======================================================

      - name: Sync with latest repository
        run: |
          git fetch origin main
          git reset --hard origin/main


      # ======================================================
      # UPDATE MOVIE NEWS
      # ======================================================

      - name: Update movie news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_movie_news.py


      # ======================================================
      # CHECK GENERATED NEWS
      # ======================================================

      - name: Check generated news
        run: |
          python - <<'PYTHON'
          import json
          import os

          filename = "movie-news.json"

          if not os.path.exists(filename):
              raise RuntimeError(
                  "movie-news.json was not created"
              )

          with open(
              filename,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          items = data.get("items", [])

          print()
          print("=================================")
          print("MOVIE NEWS:", len(items))
          print("=================================")
          print()

          if len(items) == 0:
              raise RuntimeError(
                  "No movie or series news generated"
              )

          for i, item in enumerate(items, 1):

              title = item.get("title", "")
              image = item.get("image", "")
              summary = item.get("summary", "")

              print(f"{i}. {title}")

              if not image:
                  raise RuntimeError(
                      f"Article {i} has no image"
                  )

              if len(summary) < 120:
                  raise RuntimeError(
                      f"Article {i} summary is too short"
                  )
          PYTHON


      # ======================================================
      # COMMIT AND PUSH
      # ======================================================

      - name: Commit and push news
        run: |
          git config user.name "MOVINS News Bot"
          git config user.email "actions@github.com"

          git add movie-news.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update MOVINS movie news"

          git push origin main


      # ======================================================
      # JOB SUMMARY
      # ======================================================

      - name: Complete job
        run: |
          echo "================================="
          echo "MOVINS NEWS UPDATE COMPLETED"
          echo "================================="
