name: MOVINS Movie News Update

on:

  # تشغيل تلقائي كل 6 ساعات
  schedule:
    - cron: "0 */6 * * *"

  # تشغيل يدوي من GitHub Actions
  workflow_dispatch:

  # تشغيل عند تعديل ملفات المشروع
  push:
    paths:
      - "update_movie_news.py"
      - "requirements.txt"
      - ".github/workflows/update-movie-news.yml"


# السماح للـ Action بتعديل المستودع
permissions:
  contents: write


# منع تشغيل تحديثين في نفس الوقت
concurrency:
  group: movins-movie-news-update
  cancel-in-progress: false


jobs:

  update:

    runs-on: ubuntu-latest


    steps:


      # =================================================
      # DOWNLOAD REPOSITORY
      # =================================================

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # =================================================
      # SETUP PYTHON
      # =================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # =================================================
      # INSTALL LIBRARIES
      # =================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # =================================================
      # CHECK GEMINI API KEY
      # =================================================

      - name: Check Gemini API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          if [ -z "$GEMINI_API_KEY" ]; then

            echo "ERROR: GEMINI_API_KEY is missing."

            exit 1

          fi

          echo "Gemini API Key detected successfully."


      # =================================================
      # UPDATE MOVIE NEWS
      # =================================================

      - name: Update movie news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python update_movie_news.py


      # =================================================
      # CHECK GENERATED NEWS
      # =================================================

      - name: Check generated news
        run: |

          python - << 'PYTHON'

          import json


          with open(
              "movie-news.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          items = data.get(
              "items",
              []
          )


          print(
              "MOVIE NEWS:",
              len(items)
          )


          if not items:

              raise RuntimeError(
                  "No movie news generated"
              )


          print(
              "News generated successfully."
          )

          PYTHON


      # =================================================
      # COMMIT AND PUSH NEWS
      # =================================================

      - name: Commit and push news
        run: |

          git config user.name "MOVINS News Bot"

          git config user.email "movins-bot@users.noreply.github.com"


          # إضافة ملف الأخبار
          git add movie-news.json


          # إذا لم تتغير الأخبار
          if git diff --cached --quiet; then

            echo "No news changes."

            exit 0

          fi


          # إنشاء Commit محلي
          git commit -m "Update MOVINS movie news"


          # جلب أحدث تغييرات المستودع
          git pull origin main --rebase


          # إرسال الأخبار إلى GitHub
          git push origin main


          echo "News pushed successfully."
