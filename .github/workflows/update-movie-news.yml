name: MOVINS Movie News Update

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: movins-movie-news-update
  cancel-in-progress: false

jobs:
  update:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # SETUP PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4


      # ==========================================
      # UPDATE MOVIE NEWS
      # ==========================================

      - name: Update movie news
        run: |
          python update_movie_news.py


      # ==========================================
      # VALIDATE GENERATED FILE
      # ==========================================

      - name: Check movie news file
        run: |
          python - <<'PYTHON'
          import json
          import os

          filename = "movie-news.json"

          if not os.path.exists(filename):
              raise RuntimeError(
                  "movie-news.json was not created"
              )

          try:
              with open(
                  filename,
                  "r",
                  encoding="utf-8"
              ) as file:
                  data = json.load(file)

          except Exception as error:
              raise RuntimeError(
                  f"Invalid JSON file: {error}"
              )

          items = data.get("items", [])

          print()
          print("=================================")
          print("MOVIE NEWS:", len(items))
          print("=================================")
          print()

          for index, item in enumerate(items, 1):

              title = item.get("title", "")
              summary = item.get("summary", "")
              image = item.get("image", "")
              link = item.get("link", "")

              print(f"{index}. {title}")
              print(f"   Summary length: {len(summary)}")
              print(f"   Image: {'YES' if image else 'NO'}")

              if not title:
                  raise RuntimeError(
                      f"Article {index} has no title"
                  )

              if not summary:
                  raise RuntimeError(
                      f"Article {index} has no summary"
                  )

              if not link:
                  raise RuntimeError(
                      f"Article {index} has no original link"
                  )

          if len(items) == 0:
              print(
                  "WARNING: No new articles were found."
              )
              print(
                  "Workflow will continue successfully."
              )
          else:
              print()
              print(
                  "Movie news validation completed successfully."
              )

          PYTHON


      # ==========================================
      # COMMIT AND PUSH
      # ==========================================

      - name: Commit and push news
        run: |

          git config user.name "MOVINS News Bot"
          git config user.email "actions@github.com"

          git add movie-news.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update MOVINS movie news"

          git pull --rebase origin main

          git push origin main


      # ==========================================
      # COMPLETE
      # ==========================================

      - name: Complete job
        run: |
          echo "================================="
          echo "MOVINS MOVIE NEWS UPDATE COMPLETED"
          echo "================================="
