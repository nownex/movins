name: Update MOVINS Movie News


on:

  workflow_dispatch:


  schedule:

    - cron: "0 */3 * * *"


permissions:

  contents: write


jobs:

  update-news:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout repository

        uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      - name: Update movie news

        run: |

          python update_movie_news.py


      - name: Commit news

        run: |

          git config user.name "MOVINS News Bot"

          git config user.email "actions@github.com"

          git add movie-news.json

          git diff --cached --quiet || git commit -m "Update movie news"

          git push
