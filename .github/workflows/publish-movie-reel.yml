name: Publish MOVINS Reel

on:
  workflow_dispatch:

  schedule:
    # Once every day at 18:00 Algeria time
    # GitHub Actions uses UTC.
    - cron: "0 17 * * *"

permissions:
  contents: write

concurrency:
  group: movins-reel-publisher
  cancel-in-progress: false

jobs:
  publish-reel:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Publish MOVINS Reel
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          python publish_movie_reel.py

      - name: Commit reel history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posted_movie_reels.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update MOVINS reel history"

          git pull --rebase origin main

          git push origin main
