name: Publish MOVINS Reel

on:
  workflow_dispatch:

  schedule:
    # Every day at 18:00 Algeria time
    # Algeria = UTC+1
    - cron: "0 17 * * *"

permissions:
  contents: write

concurrency:
  group: movins-reel-publisher
  cancel-in-progress: false

jobs:
  publish-reel:
    runs-on: ubuntu-latest

    steps:

      # ================================================
      # CHECKOUT
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ================================================
      # PYTHON
      # ================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ================================================
      # FFMPEG + ARABIC FONTS
      # ================================================

      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-noto-core \
            fonts-noto-extra

          echo "======================================"
          echo "FFmpeg version"
          echo "======================================"

          ffmpeg -version | head -n 1

          echo ""
          echo "======================================"
          echo "Searching for Arabic fonts"
          echo "======================================"

          find /usr/share/fonts \
            -type f \
            \( \
              -iname "*NaskhArabic*.ttf" \
              -o -iname "*Arabic*.ttf" \
            \) \
            | head -20

      # ================================================
      # PYTHON DEPENDENCIES
      # ================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            pillow \
            arabic-reshaper \
            python-bidi

      # ================================================
      # CHECK FILES
      # ================================================

      - name: Check MOVINS files
        run: |
          echo "======================================"
          echo "Checking MOVINS files"
          echo "======================================"

          test -f movies.json
          test -f publish_movie_reel.py

          echo "✓ movies.json"
          echo "✓ publish_movie_reel.py"

          if [ ! -f posted_movie_reels.json ]; then
            echo "[]" > posted_movie_reels.json
            echo "✓ created posted_movie_reels.json"
          else
            echo "✓ posted_movie_reels.json"
          fi

          echo ""
          echo "Python:"
          python --version

      # ================================================
      # CREATE + PUBLISH
      # ================================================

      - name: Create and publish MOVINS Reel
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          echo "======================================"
          echo "MOVINS REEL START"
          echo "======================================"

          python publish_movie_reel.py

      # ================================================
      # SAVE HISTORY
      # ================================================

      - name: Commit reel history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "======================================"
          echo "Saving Reel history"
          echo "======================================"

          git add posted_movie_reels.json

          if git diff --cached --quiet; then
            echo "No history changes."
            exit 0
          fi

          git commit -m "Update MOVINS reel history"

          echo ""
          echo "======================================"
          echo "Syncing with GitHub"
          echo "======================================"

          for i in 1 2 3 4 5; do

            echo ""
            echo "Push attempt $i / 5"

            git fetch origin main

            if git rebase origin/main; then

              echo "Rebase successful."

              if git push origin main; then

                echo ""
                echo "======================================"
                echo "PUSH SUCCESSFUL"
                echo "======================================"

                exit 0

              fi

            else

              echo "Rebase failed."

              git rebase --abort || true

            fi

            if [ "$i" -lt 5 ]; then

              echo "Retrying in 5 seconds..."

              sleep 5

            fi

          done

          echo ""
          echo "======================================"
          echo "ERROR: Git push failed"
          echo "======================================"

          exit 1
