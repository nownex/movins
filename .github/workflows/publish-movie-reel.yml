name: Publish MOVINS Reel

on:
  workflow_dispatch:

  schedule:
    - cron: "0 17 * * *"

permissions:
  contents: write

concurrency:
  group: movins-reel-publisher
  cancel-in-progress: false

jobs:
  publish-reel:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # FFMPEG
      # ==========================================

      - name: Install FFmpeg
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core

          echo "FFmpeg installed:"
          ffmpeg -version | head -n 1

      # ==========================================
      # PYTHON PACKAGES
      # ==========================================

      - name: Install Python dependencies
        run: |
          set -eux

          python -m pip install --upgrade pip

          pip install \
            requests \
            pillow

      # ==========================================
      # VERIFY FILES
      # ==========================================

      - name: Verify MOVINS files
        run: |
          set -eux

          echo "======================================"
          echo "MOVINS FILE CHECK"
          echo "======================================"

          pwd

          echo ""
          echo "Files:"
          ls -la

          echo ""
          echo "Checking movies.json..."

          test -f movies.json

          echo "OK: movies.json"

          echo ""
          echo "Checking publish_movie_reel.py..."

          test -f publish_movie_reel.py

          echo "OK: publish_movie_reel.py"

          echo ""
          echo "Python version:"
          python --version

          echo ""
          echo "Script size:"
          wc -l publish_movie_reel.py

      # ==========================================
      # RUN REEL SCRIPT
      # ==========================================

      - name: Create and publish MOVINS Reel
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euxo pipefail

          echo "======================================"
          echo "MOVINS REEL START"
          echo "======================================"

          echo ""
          echo "Python executable:"
          which python

          echo ""
          echo "Starting publish_movie_reel.py..."

          python -u publish_movie_reel.py

          echo ""
          echo "======================================"
          echo "MOVINS REEL SCRIPT FINISHED"
          echo "======================================"

      # ==========================================
      # VERIFY HISTORY
      # ==========================================

      - name: Verify reel history
        run: |
          set -eux

          echo "======================================"
          echo "CHECKING REEL HISTORY"
          echo "======================================"

          if [ -f posted_movie_reels.json ]; then

            echo "posted_movie_reels.json exists"

            cat posted_movie_reels.json

          else

            echo "ERROR: posted_movie_reels.json was not created"

            exit 1

          fi

      # ==========================================
      # COMMIT
      # ==========================================

      - name: Commit reel history
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posted_movie_reels.json

          if git diff --cached --quiet; then
            echo "No history changes."
            exit 0
          fi

          git commit -m "Update MOVINS reel history"

          git fetch origin main

          git rebase origin/main

          git push origin main
