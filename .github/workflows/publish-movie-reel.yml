name: Publish MOVINS Reel

on:
  workflow_dispatch:

  schedule:
    # Every day at 18:00 Algeria time
    # GitHub Actions uses UTC.
    - cron: "0 17 * * *"

permissions:
  contents: write

concurrency:
  group: movins-reel-publisher
  cancel-in-progress: false

jobs:

  publish-reel:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # =====================================================
      # CHECK FILES
      # =====================================================

      - name: Check MOVINS Reel files
        run: |

          test -f movies.json
          test -f publish_movie_reel.py
          test -f posted_movie_reels.json

          echo "All required MOVINS Reel files found."


      # =====================================================
      # PUBLISH REEL
      # =====================================================

      - name: Publish MOVINS Reel
        env:

          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

        run: |

          python publish_movie_reel.py


      # =====================================================
      # SAVE HISTORY
      # =====================================================

      - name: Commit reel history
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posted_movie_reels.json

          if git diff --cached --quiet; then

            echo "No changes to commit."

            exit 0

          fi

          git commit -m "Update MOVINS reel history"

          git pull --rebase origin main

          git push origin main
