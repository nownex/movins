name: MOVINS Movie Update

on:

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      # ===================================================
      # CHECKOUT
      # ===================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ===================================================
      # PYTHON
      # ===================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # ===================================================
      # DEPENDENCIES
      # ===================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # ===================================================
      # UPDATE MOVIE DATA
      # ===================================================

      - name: Update movie data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

        run: |
          python update_movies.py


      # ===================================================
      # FACEBOOK PUBLISH
      # ===================================================

      - name: Publish to Facebook
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

        run: |
          python facebook_publisher.py


      # ===================================================
      # SAVE UPDATED DATA
      # ===================================================

      - name: Commit updated data
        run: |

          git config user.name "MOVINS Bot"

          git config user.email "actions@github.com"


          git add movies.json posted_movies.json


          if git diff --cached --quiet; then

            echo "No changes."

          else

            git commit -m "Update MOVINS movies"

            git push

          fi
