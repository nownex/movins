name: MOVINS Movie Update

on:

  workflow_dispatch:

  schedule:
    - cron: "0 */3 * * *"


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      # ===================================================
      # CHECKOUT
      # ===================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ===================================================
      # PYTHON
      # ===================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # ===================================================
      # DEPENDENCIES
      # ===================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # ===================================================
      # UPDATE MOVIE DATA
      # ===================================================

      - name: Update movie data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

        run: |
          python update_movies.py


      # ===================================================
      # FACEBOOK PUBLISH
      # ===================================================

      - name: Publish to Facebook
        env:
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

        run: |
          python facebook_publisher.py


      # ===================================================
      # CHECK FILES
      # ===================================================

      - name: Check generated files
        run: |

          echo "======================================"

          echo "MOVINS generated files"

          echo "======================================"

          if [ -f movies.json ]; then
            echo "movies.json: OK"
          else
            echo "movies.json: MISSING"
            exit 1
          fi

          if [ -f posted_movies.json ]; then
            echo "posted_movies.json: OK"
          else
            echo "posted_movies.json: NOT FOUND"
            echo "Creating empty posted_movies.json"

            echo "[]" > posted_movies.json
          fi


      # ===================================================
      # SAVE UPDATED DATA
      # ===================================================

      - name: Commit updated data
        run: |

          git config user.name "MOVINS Bot"

          git config user.email "actions@github.com"


          git add movies.json posted_movies.json


          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit \
              -m "Update MOVINS movies"

            git push

          fi
